name: SceneSteward Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    name: Backend Security, Lints & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scenesteward
          POSTGRES_PASSWORD: superuser_test_password
          POSTGRES_DB: scenesteward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff Lint Check
        run: |
          ruff check backend

      - name: Bootstrap PostgreSQL Roles & Permissions
        env:
          PGPASSWORD: superuser_test_password
        run: |
          psql -h localhost -U scenesteward -d scenesteward_test -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'scenesteward_app') THEN
                CREATE ROLE scenesteward_app WITH LOGIN PASSWORD 'app_test_password' NOBYPASSRLS NOINHERIT;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'scenesteward_readonly') THEN
                CREATE ROLE scenesteward_readonly WITH LOGIN PASSWORD 'ro_test_password' NOBYPASSRLS NOINHERIT;
              END IF;
            END \$\$;
          "

      - name: Run Alembic Migrations to Head
        env:
          ALEMBIC_DATABASE_URL: "postgresql+psycopg://scenesteward:superuser_test_password@localhost:5432/scenesteward_test"
          DATABASE_IDENTITY_SECRET: "ci_database_identity_secret_2026_test_only"
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Grant Runtime Table & Sequence Permissions to scenesteward_app
        env:
          PGPASSWORD: superuser_test_password
        run: |
          psql -h localhost -U scenesteward -d scenesteward_test -c "
            GRANT USAGE ON SCHEMA public TO scenesteward_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO scenesteward_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO scenesteward_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO scenesteward_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO scenesteward_app;
          "

      - name: Run Pytest Suite (Unit, Matrix, Security & Integration)
        env:
          DATABASE_URL: "postgresql+psycopg://scenesteward_app:app_test_password@localhost:5432/scenesteward_test"
          DATABASE_URL_ADMIN: "postgresql+psycopg://scenesteward:superuser_test_password@localhost:5432/scenesteward_test"
          DATABASE_URL_TEST: "postgresql+psycopg://scenesteward_app:app_test_password@localhost:5432/scenesteward_test"
          DATABASE_IDENTITY_SECRET: "ci_database_identity_secret_2026_test_only"
          APP_ENCRYPTION_KEY: "67yRWp6G4NQfdYCVyaajG5JspDXj6h8qHmly0wKpDkM="
          AUTH_DEV_SECRET: "ci_auth_dev_secret_0123456789abcdef0123456789abcdef"
        run: |
          pytest -v backend/tests

      - name: Verify 8-Step Documentary Lifecycle
        env:
          DATABASE_URL: "postgresql+psycopg://scenesteward_app:app_test_password@localhost:5432/scenesteward_test"
          DATABASE_URL_ADMIN: "postgresql+psycopg://scenesteward:superuser_test_password@localhost:5432/scenesteward_test"
          DATABASE_URL_TEST: "postgresql+psycopg://scenesteward_app:app_test_password@localhost:5432/scenesteward_test"
          DATABASE_IDENTITY_SECRET: "ci_database_identity_secret_2026_test_only"
          APP_ENCRYPTION_KEY: "67yRWp6G4NQfdYCVyaajG5JspDXj6h8qHmly0wKpDkM="
          AUTH_DEV_SECRET: "ci_auth_dev_secret_0123456789abcdef0123456789abcdef"
        run: |
          python backend/scripts/verify_documentary_lifecycle.py

  frontend-build:
    name: Frontend Type Check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Production Next.js Build
        env:
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
        run: |
          cd frontend
          npm run build

  docker-preflight:
    name: Docker Infrastructure & Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Staging Docker Compose Configuration
        env:
          APP_ENV: staging
          DATABASE_PASSWORD: test_ci_db_password_1234567890
          APP_PASSWORD: test_ci_app_password_1234567890
          APP_ENCRYPTION_KEY: "67yRWp6G4NQfdYCVyaajG5JspDXj6h8qHmly0wKpDkM="
          DATABASE_IDENTITY_SECRET: "test_ci_db_trust_secret_1234567890_ci"
          AUTH_DEV_SECRET: "test_ci_auth_secret_1234567890_ci_abcdef"
        run: |
          docker compose -f docker-compose.staging.yml config

      - name: Test Backend Container Build
        run: |
          docker build -t scenesteward-backend:ci -f backend/Dockerfile .
