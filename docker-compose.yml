# Local development stack: PostgreSQL + migrations + API.
# Docker is NOT required for day-to-day work — see README.md for the host Postgres path.
# Dev defaults only; override POSTGRES_PASSWORD / DATABASE_URL for any shared environment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scenesteward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scenesteward}
      POSTGRES_DB: ${POSTGRES_DB:-scenesteward}
    ports:
      - "5432:5432"
    volumes:
      - scenesteward-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scenesteward}:${POSTGRES_PASSWORD:-scenesteward}@db:5432/${POSTGRES_DB:-scenesteward}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scenesteward}:${POSTGRES_PASSWORD:-scenesteward}@db:5432/${POSTGRES_DB:-scenesteward}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-dev}
      AUTH_DEV_SECRET: ${AUTH_DEV_SECRET:-local-dev-secret-change-me}
      AUTH_ISSUER: ${AUTH_ISSUER:-scenesteward-dev}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-scenesteward-api}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-offline}
      SWITCH_ADAPTER: ${SWITCH_ADAPTER:-test}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: /srv/scenesteward/backend/var/storage
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - scenesteward-storage:/srv/scenesteward/backend/var/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  scenesteward-pgdata:
  scenesteward-storage:
