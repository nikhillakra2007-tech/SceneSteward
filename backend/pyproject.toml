[project]
name = "scenesteward-backend"
version = "0.1.0"
description = "SceneSteward — participant-centred documentary production workspace (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "python-docx>=1.1.0",
    "redis>=5.0",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
